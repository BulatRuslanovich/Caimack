name: caimack

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: music
      POSTGRES_DB: music
      POSTGRES_PASSWORD: 1234
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256" # чтобы хешировал пароли не по старому md5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]

volumes:
  postgres-data:

networks:
  internal:
    driver: bridge